<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><title>SKY SLEEP SERVICE</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07122b"><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;font-family:system-ui,Roboto,sans-serif}body{margin:0;background:#050b1c;color:#14213d}
#app{max-width:440px;margin:0 auto;min-height:100vh;background:#f3f5fa;padding-bottom:70px}
.sp{background:linear-gradient(#07122b,#16305f);color:#fff;min-height:100vh;text-align:center;padding:70px 28px 30px;display:flex;flex-direction:column;align-items:center}
.sp h1{margin:0;font-size:34px}.sp h1 i{color:#d9a93c;font-style:normal}.sp small{color:#d9a93c;letter-spacing:6px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:2px solid #d9a93c;background:none;color:#fff;font-weight:700;font-size:16px;margin-top:12px}
.g{background:#d9a93c;color:#1b1500}.b{background:#1f5fe0;border-color:#1f5fe0}.s{display:inline-block;width:auto;padding:8px 12px;font-size:13px;margin:4px 4px 0 0}.r{color:#b91c1c;border-color:#b91c1c;background:#fff}
.top{padding:14px 16px;background:#fff;font-weight:700}.mu{color:#6b7690;font-size:12px}.pr{color:#1f5fe0;font-weight:700;font-size:13px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cfd6e6;border-radius:8px;font-size:15px;margin-top:4px}label{display:block;font-size:13px;font-weight:600;margin-top:10px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 16px}.cats span{padding:7px 12px;border-radius:20px;background:#fff;border:1px solid #cfd6e6;font-size:13px;white-space:nowrap}.cats .on{background:#1f5fe0;color:#fff}
.row{display:flex;gap:10px;background:#fff;border-radius:12px;padding:8px;margin:0 16px 10px;position:relative;box-shadow:0 2px 8px #0001}
.im{width:84px;height:72px;border-radius:8px;background:#0c1d45 center/cover;flex:none;display:grid;place-items:center}
.k{background:#fff;border-radius:10px;padding:12px;margin:0 16px 10px}.empty{padding:26px 16px;text-align:center;color:#6b7690}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;display:flex;border-top:1px solid #e3e7f0}
.nav div{flex:1;text-align:center;padding:10px 0;font-size:11px;color:#6b7690}.nav .on{color:#1f5fe0;font-weight:700}
.gal{height:220px;background:#0c1d45;display:flex;overflow-x:auto;scroll-snap-type:x mandatory}.gal>*{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:start}
.p{padding:14px 16px}.st{font-size:11px;padding:2px 8px;border-radius:10px;background:#eee;font-weight:700}.heart{position:absolute;right:10px;top:8px;font-size:20px;color:#bbb}.heart.on{color:#e11d48}
.th img,.th video{width:70px;height:60px;object-fit:cover;border-radius:6px;margin:4px 4px 0 0}#bar{display:none;background:#b91c1c;color:#fff;text-align:center;font-size:13px;padding:6px;position:sticky;top:0}
</style></head><body><div id="bar">Sem conexão com o servidor.</div><div id="app"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,doc,onSnapshot,query,where,setDoc,updateDoc,deleteDoc,getDoc,increment}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBkgGWZzH7RyaFCHMN65Akyr5FGVHI9vJA",authDomain:"sky-sleep-service.firebaseapp.com",projectId:"sky-sleep-service",storageBucket:"sky-sleep-service.firebasestorage.app",messagingSenderId:"1042703764190",appId:"1:1042703764190:web:9bbe66a62a60b7a2eb904f"});
const auth=getAuth(app),db=getFirestore(app),CL="m73mzpow",PRESET="skysleep";
const CATS=["Hotéis","Hospedarias","Pousadas","Pensões","Guest Houses","Apart-hotéis"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={v:"splash",est:[],q:"",cat:"",fav:JSON.parse(localStorage.ssfav||"[]"),sel:null,pt:"noite",admin:false,at:"est",form:null,un:null};
const money=v=>v?Number(v).toLocaleString("pt-PT")+" Kz":null,minP=e=>{const p=Object.values(e.prices||{}).filter(Boolean).map(Number);return p.length?Math.min(...p):0},img=e=>(e.media||[]).find(m=>m.type==="image");
function listen(){S.un&&S.un();const q=S.admin?collection(db,"establishments"):query(collection(db,"establishments"),where("status","==","PUBLICADO"));
 S.un=onSnapshot(q,sn=>{S.est=sn.docs.map(d=>({id:d.id,...d.data()}));R()},e=>{$("#bar").style.display="block"})}
onAuthStateChanged(auth,async u=>{S.admin=false;if(u){try{S.admin=(await getDoc(doc(db,"admins",u.uid))).exists()}catch(e){}}listen();R()});
addEventListener("online",()=>{$("#bar").style.display="none"});addEventListener("offline",()=>{$("#bar").style.display="block"});
function card(e){const i=img(e),p=minP(e);return `<div class="row" data-open="${e.id}"><div class="im" style="${i?`background-image:url('${i.url}')`:""}">${i?"":"🏨"}</div><div><b>${esc(e.name)}</b><div class="mu">${esc([e.bairro,e.mun,e.prov].filter(Boolean).join(", ")||"Informação não cadastrada.")}</div><div class="pr">${p?"Desde "+money(p):"Preço não informado."}</div></div><span class="heart ${S.fav.includes(e.id)?"on":""}" data-fav="${e.id}">♥</span></div>`}
const pubList=()=>S.est.filter(e=>e.status==="PUBLICADO");
const nav=()=>`<div class="nav">${[["home","🏠","Início"],["map","🗺️","Mapa"],["fav","♥","Favoritos"],["prof","👤","Perfil"]].map(x=>`<div class="${S.v===x[0]?"on":""}" data-go="${x[0]}"><div style="font-size:20px">${x[1]}</div>${x[2]}</div>`).join("")}</div>`;
function vHome(){const q=S.q.toLowerCase(),L=pubList().filter(e=>(!S.cat||e.cat===S.cat)&&(!q||[e.name,e.cat,e.prov,e.mun,e.bairro,(e.services||[]).join(" ")].join(" ").toLowerCase().includes(q)));
 return `<div class="top">📍 SKY SLEEP SERVICE<input id="q" placeholder="🔍 Pesquise hotéis, bairro, serviços…" value="${esc(S.q)}"></div><div class="cats">${CATS.map(c=>`<span class="${S.cat===c?"on":""}" data-cat="${S.cat===c?"":c}">${c}</span>`).join("")}</div>${L.length?L.map(card).join(""):'<div class="empty">Nenhum estabelecimento cadastrado.</div>'}${nav()}`}
function vDet(){const e=S.est.find(x=>x.id===S.sel);if(!e)return vHome();const m=e.media||[],P=e.prices||{};
 return `<div class="top"><span data-go="home">← Voltar</span></div><div class="gal">${m.length?m.map(x=>x.type==="video"?`<video src="${x.url}" controls playsinline></video>`:`<img src="${x.url}">`).join(""):'<div style="color:#d9a93c;margin:auto">Sem fotografias cadastradas.</div>'}</div><div class="p"><h2 style="margin:0">${esc(e.name)}</h2><div class="mu">${esc(e.cat)} · ${esc([e.bairro,e.mun,e.prov].filter(Boolean).join(", "))}</div><div class="mu">★ Ainda não existem avaliações.</div>
 <p>${(e.services||[]).map(s=>`<span class="st">${esc(s)}</span> `).join("")||'<span class="mu">Serviços: Informação não cadastrada.</span>'}</p>
 <div class="cats" style="padding:0">${[["hora","Hora"],["noite","Noite"],["dia","Dia"],["semana","Semana"],["mes","Mês"]].map(k=>`<span class="${S.pt===k[0]?"on":""}" data-pt="${k[0]}">${k[1]}</span>`).join("")}</div><div class="pr" style="font-size:20px">${money(P[S.pt])||"Preço não informado."}</div>
 <p>${esc(e.desc||"Informação não cadastrada.")}</p>${e.hours?`<div class="mu">🕒 ${esc(e.hours)}</div>`:""}
 ${e.wa?`<a class="btn g" style="text-align:center;text-decoration:none;background:#17a34a;color:#fff;border-color:#17a34a" target="_blank" data-ct="${e.id}" href="https://wa.me/${String(e.wa).replace(/\D/g,"")}">WhatsApp</a>`:""}${e.phone?`<a class="btn b" style="text-align:center;text-decoration:none;color:#fff" data-ct="${e.id}" href="tel:${esc(e.phone)}">Ligar</a>`:""}${!e.wa&&!e.phone?'<div class="mu">Contactos: Informação não cadastrada.</div>':""}
 ${e.lat&&e.lng?`<a class="btn g" style="text-align:center;text-decoration:none" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lng}">Ver rota</a>`:""}</div>`}
function vMap(){const L=pubList().filter(e=>e.lat&&e.lng);return `<div class="top">🗺️ Mapa</div>${L.length?L.map(e=>card(e)+`<div style="margin:-6px 16px 10px"><a class="mu" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${e.lat},${e.lng}">Abrir no mapa</a></div>`).join(""):'<div class="empty">Nenhum estabelecimento com localização cadastrada.</div>'}${nav()}`}
const vFav=()=>{const L=pubList().filter(e=>S.fav.includes(e.id));return `<div class="top">Favoritos</div><div style="height:10px"></div>${L.length?L.map(card).join(""):'<div class="empty">Nenhum favorito.</div>'}${nav()}`};
const vProf=()=>`<div class="top">Perfil</div><div class="p">${S.admin?`<button class="btn g" data-go="adm">Abrir PAINEL SUPER ADM</button><button class="btn b" data-out>Sair</button>`:auth.currentUser?`<div class="mu">Sessão iniciada, mas sem permissão de administrador.</div><button class="btn b" data-out>Sair</button>`:`<b>SUPER ADM LOGIN</b><label>E-mail</label><input id="em" type="email"><label>Palavra-passe</label><input id="pw" type="password"><button class="btn g" data-login>Entrar</button>`}</div>${nav()}`;
function vAdm(){if(!S.admin)return vProf();const E=S.est,c=s=>E.filter(e=>e.status===s).length;let b="";
 if(S.at==="est")b=`<div class="k">Total: <b>${E.length}</b> · Publicados: <b>${c("PUBLICADO")}</b> · Suspensos: <b>${c("SUSPENSO")}</b> · Visualizações: <b>${E.reduce((a,e)=>a+(e.views||0),0)}</b> · Contactos: <b>${E.reduce((a,e)=>a+(e.contacts||0),0)}</b></div>`+(E.length?E.map(e=>`<div class="k"><b>${esc(e.name)}</b> <span class="st">${e.status}</span><div class="mu">${esc(e.cat)}</div><button class="btn s b" data-ed="${e.id}">Editar</button><button class="btn s g" data-stt="${e.id}|PUBLICADO">Publicar</button><button class="btn s r" data-stt="${e.id}|SUSPENSO">Suspender</button><button class="btn s r" data-del="${e.id}">Eliminar</button></div>`).join(""):'<div class="empty">Nenhum estabelecimento cadastrado.</div>');
 else{const f=S.form||(S.form={cat:CATS[0],status:"RASCUNHO",prices:{},services:[],media:[]});const I=(k,l,t="text")=>`<label>${l}</label><input data-f="${k}" type="${t}" value="${esc(f[k])}">`;
 b=`<div class="k">${I("name","Nome *")}<label>Tipo</label><select data-f="cat">${CATS.map(c=>`<option ${f.cat===c?"selected":""}>${c}</option>`).join("")}</select><label>Descrição</label><textarea data-f="desc" rows="3">${esc(f.desc)}</textarea>${I("prov","Província")}${I("mun","Município")}${I("bairro","Bairro")}${I("addr","Endereço")}${I("lat","Latitude","number")}${I("lng","Longitude","number")}${I("phone","Telefone","tel")}${I("wa","WhatsApp","tel")}${I("email","E-mail")}${I("hours","Horário")}<label>Serviços (separados por vírgula)</label><input data-f="services" value="${esc((f.services||[]).join(", "))}"><label>Preços (Kz)</label>${["hora","noite","dia","semana","mes"].map(k=>`<input data-p="${k}" type="number" placeholder="${k}" value="${f.prices[k]||""}">`).join("")}<label>Estado</label><select data-f="status">${["RASCUNHO","PUBLICADO","SUSPENSO"].map(s=>`<option ${f.status===s?"selected":""}>${s}</option>`).join("")}</select>
 <button class="btn s b" style="width:100%" data-up="image/*">ADICIONAR FOTOGRAFIAS</button><button class="btn s b" style="width:100%" data-up="video/*">ADICIONAR VÍDEOS</button><div class="th">${f.media.map((m,i)=>(m.type==="video"?`<video src="${m.url}"></video>`:`<img src="${m.url}">`)+`<a data-rm="${i}" style="color:#b91c1c">✕</a>`).join("")}</div><button class="btn g" data-save>Salvar</button></div>`}
 return `<div class="top">👑 PAINEL SUPER ADM</div><div class="cats"><span class="${S.at==="est"?"on":""}" data-at="est">Estabelecimentos</span><span class="${S.at==="new"?"on":""}" data-at="new">+ Novo</span></div>${b}${nav()}`}
function R(){const a=document.activeElement,id=a&&a.id,p=a&&a.selectionStart;const V={splash:()=>`<div class="sp"><div style="font-size:60px">🌙🛏️</div><h1>SKY <i>SLEEP</i></h1><small>SERVICE</small><p style="margin-top:40px">O seu espaço, o nosso compromisso.</p><div style="flex:1"></div><button class="btn g" data-go="home">Entrar</button><button class="btn" data-go="prof">Área ADM</button></div>`,home:vHome,detail:vDet,map:vMap,fav:vFav,prof:vProf,adm:vAdm};$("#app").innerHTML=V[S.v]();if(id&&$("#"+id)){$("#"+id).focus();try{$("#"+id).setSelectionRange(p,p)}catch(e){}}}
addEventListener("input",e=>{const t=e.target;if(t.id==="q"){S.q=t.value;R()}if(t.dataset.f)S.form[t.dataset.f]=t.dataset.f==="services"?t.value.split(",").map(s=>s.trim()).filter(Boolean):t.type==="number"&&t.value?+t.value:t.value;if(t.dataset.p)S.form.prices[t.dataset.p]=t.value?+t.value:0});
async function upload(f){const fd=new FormData();fd.append("file",f);fd.append("upload_preset",PRESET);const r=await fetch(`https://api.cloudinary.com/v1_1/${CL}/auto/upload`,{method:"POST",body:fd});const j=await r.json();if(!j.secure_url)throw new Error(j.error?.message||"falha");return{url:j.secure_url,type:j.resource_type==="video"?"video":"image",pid:j.public_id}}
addEventListener("click",async e=>{const t=e.target.closest("[data-go],[data-open],[data-cat],[data-fav],[data-pt],[data-login],[data-out],[data-at],[data-ed],[data-stt],[data-del],[data-up],[data-rm],[data-save],[data-ct]");if(!t)return;const d=t.dataset;
 try{if(d.fav){e.stopPropagation();S.fav=S.fav.includes(d.fav)?S.fav.filter(x=>x!==d.fav):[...S.fav,d.fav];localStorage.ssfav=JSON.stringify(S.fav)}
 else if(d.ct){updateDoc(doc(db,"establishments",d.ct),{contacts:increment(1)}).catch(()=>{});return}
 else if(d.go){S.v=d.go}
 else if(d.open){S.sel=d.open;S.v="detail";updateDoc(doc(db,"establishments",d.open),{views:increment(1)}).catch(()=>{})}
 else if(d.cat!==undefined)S.cat=d.cat;else if(d.pt)S.pt=d.pt;
 else if(d.login!==undefined){await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value);return}
 else if(d.out!==undefined){await signOut(auth);S.v="prof";return}
 else if(d.at){S.at=d.at;if(d.at==="new")S.form=null}
 else if(d.ed){S.form=JSON.parse(JSON.stringify(S.est.find(z=>z.id===d.ed)));S.at="new"}
 else if(d.stt){const[i,s]=d.stt.split("|");await updateDoc(doc(db,"establishments",i),{status:s})}
 else if(d.del){if(confirm("Eliminar este estabelecimento?"))await deleteDoc(doc(db,"establishments",d.del))}
 else if(d.rm!==undefined)S.form.media.splice(+d.rm,1);
 else if(d.up){const i=document.createElement("input");i.type="file";i.accept=d.up;i.multiple=true;i.onchange=async()=>{for(const f of i.files){try{S.form.media.push(await upload(f))}catch(x){alert("Falha no envio: "+x.message)}}R()};i.click();return}
 else if(d.save!==undefined){const f=S.form;if(!f.name)return alert("Indique o nome.");const{id,...data}=f;const ref=id?doc(db,"establishments",id):doc(collection(db,"establishments"));await setDoc(ref,data,{merge:true});S.form=null;S.at="est"}
 }catch(x){alert(x.code==="auth/invalid-credential"?"E-mail ou palavra-passe incorretos.":"Erro: "+(x.message||x))}R()});
R();
</script></body></html>
